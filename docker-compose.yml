services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: xiaosu
      POSTGRES_PASSWORD: xiaosu_dev_password
      POSTGRES_DB: xiaosu
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiaosu -d xiaosu"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://xiaosu:xiaosu_dev_password@db:5432/xiaosu
      LOG_DIR: /app/logs
      UPLOAD_DIR: /app/uploads
    ports: ["8000:8000"]
    volumes: ["./logs:/app/logs", "./data/uploads:/app/uploads"]
    depends_on:
      db: {condition: service_healthy}
  dingtalk:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://xiaosu:xiaosu_dev_password@db:5432/xiaosu
      LOG_DIR: /app/logs
      UPLOAD_DIR: /app/uploads
    command: ["uv", "run", "python", "-m", "app.dingtalk_bot"]
    volumes: ["./logs:/app/logs", "./data/uploads:/app/uploads"]
    depends_on:
      db: {condition: service_healthy}
    profiles: ["dingtalk"]
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  pgdata:
