[project]
name = "xiaosu-backend"
version = "0.1.0"
description = "Internal AI assistant Xiaosu"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "openai>=1.50,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "python-multipart>=0.0.12",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "dingtalk-stream>=0.24",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
